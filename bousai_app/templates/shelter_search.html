{% extends "base.html" %}

{% block title %}避難所検索 - 防災アプリ{% endblock %}

{% block content %}
<style>
  .shelter-search-page { width: min(100% - 32px, 1040px); margin: 28px auto 56px; }
  .shelter-search-header { display: flex; justify-content: space-between; align-items: center; gap: 18px; margin-bottom: 20px; }
  .shelter-search-title { margin: 0; color: var(--blue); font-size: 30px; }
  .home-return { padding: 10px 18px; border-radius: 7px; color: #fff; background: var(--blue); font-weight: 700; text-decoration: none; }
  .search-shell { padding: 24px; border: 1px solid rgba(220, 229, 240, .85); border-radius: 14px; background: #fff; box-shadow: 0 7px 25px rgba(38, 75, 118, .08); }
  .location-search-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end; }
  .search-label { display: grid; gap: 7px; color: var(--ink); font-weight: 700; }
  .search-input, .keyword-input { width: 100%; min-height: 48px; padding: 10px 14px; border: 1px solid #cdd9e7; border-radius: 7px; color: var(--ink); background: #fbfdff; font: inherit; }
  .search-button { min-height: 48px; padding: 10px 24px; border: 0; border-radius: 7px; color: #fff; background: var(--blue); font: inherit; font-weight: 700; cursor: pointer; }
  .keyword-heading { margin: 24px 0 10px; color: var(--ink); font-size: 18px; }
  .keyword-options { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .keyword-option { display: flex; align-items: center; gap: 5px; min-width: 0; color: var(--ink); font-size: 13px; }
  .keyword-option input { width: 16px; height: 16px; accent-color: var(--blue); }
  .keyword-search-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; max-width: 760px; margin: 16px auto 0; }
  .map-heading { margin: 26px 0 10px; color: var(--ink); font-size: 18px; }
  #shelterSearchMap { height: 430px; border-radius: 9px; overflow: hidden; }
  .map-empty { margin: 10px 0 0; color: var(--muted); font-size: 13px; }
  @media (max-width: 800px) {
    .shelter-search-page { width: min(100% - 20px, 1040px); margin-top: 20px; }
    .shelter-search-header { align-items: flex-start; flex-direction: column; }
    .shelter-search-title { font-size: 25px; }
    .home-return { align-self: flex-end; }
    .search-shell { padding: 16px; }
    .location-search-row, .keyword-search-row { grid-template-columns: 1fr; }
    .keyword-options { grid-template-columns: repeat(2, 1fr); }
    #shelterSearchMap { height: 320px; }
  }
</style>

<div class="shelter-search-page">
  <div class="shelter-search-header">
    <h1 class="shelter-search-title">避難所検索</h1>
    <a class="home-return" href="/">ホームに戻る</a>
  </div>
  <section class="search-shell" aria-label="避難所検索条件">
    <form id="shelterSearchForm" action="{{ url_for('search_results') }}" method="get">
      <div class="location-search-row">
        <label class="search-label">現在地入力
          <input class="search-input" id="currentLocationInput" name="location" type="text" placeholder="現在地を取得、または住所を入力">
        </label>
        <button class="search-button" id="locationSearchButton" type="button">検索</button>
      </div>
      <input id="latitudeInput" name="latitude" type="hidden">
      <input id="longitudeInput" name="longitude" type="hidden">
      <h2 class="map-heading">避難所マップ</h2>
      <div id="shelterSearchMap" aria-label="避難所検索地図"></div>
      <p class="map-empty">現在地を取得できない場合は、青森市周辺を中心に表示します。</p>
      <h2 class="keyword-heading">キーワード選択</h2>
      <div class="keyword-options">
        <label class="keyword-option"><input type="checkbox" name="barrier_free" value="1">バリアフリー</label>
        <label class="keyword-option"><input type="checkbox" name="pets" value="1">ペット同伴</label>
        <label class="keyword-option"><input type="checkbox" name="low_crowding" value="1">混雑度50%以下</label>
        <label class="keyword-option"><input type="checkbox" name="nearby" value="1">半径2km以内</label>
        <label class="keyword-option"><input type="checkbox" name="open" value="1">開設中</label>
        <label class="keyword-option"><input type="checkbox" name="closed" value="1">閉鎖中</label>
      </div>
      <div class="keyword-search-row">
        <input class="keyword-input" name="keyword" type="search" placeholder="施設名・住所・地区などを入力">
        <button class="search-button" type="submit">検索</button>
      </div>
    </form>
  </section>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const defaultLocation = [40.8296, 140.7346];
  const map = L.map('shelterSearchMap').setView(defaultLocation, 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {attribution: '© OpenStreetMap contributors'}).addTo(map);
  let currentMarker = L.marker(defaultLocation).addTo(map).bindPopup('現在地（仮設定: 青森駅）');
  const shelters = {{ shelters|tojson }};

  function getShelterCoordinates(shelter) {
    const latitude = Number(shelter.latitude ?? shelter.lat);
    const longitude = Number(shelter.longitude ?? shelter.lng ?? shelter.lon);
    if (Number.isFinite(latitude) && Number.isFinite(longitude)) return [latitude, longitude];

    const location = String(shelter.location || shelter.coordinates || '').trim();
    const match = location.match(/^\s*(-?\d+(?:\.\d+)?)\s*[,、 ]\s*(-?\d+(?:\.\d+)?)\s*$/);
    return match ? [Number(match[1]), Number(match[2])] : null;
  }

  shelters.forEach(shelter => {
    const coordinates = getShelterCoordinates(shelter);
    if (!coordinates) return;
    const popup = document.createElement('div');
    const name = document.createElement('strong');
    name.textContent = shelter.name || '避難所';
    popup.appendChild(name);
    if (shelter.address) {
      const address = document.createElement('div');
      address.textContent = shelter.address;
      popup.appendChild(address);
    }
    L.marker(coordinates).addTo(map).bindPopup(popup);
  });
  document.getElementById('locationSearchButton').addEventListener('click', () => {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(position => {
      const {latitude, longitude} = position.coords;
      document.getElementById('latitudeInput').value = latitude;
      document.getElementById('longitudeInput').value = longitude;
      document.getElementById('currentLocationInput').value = `${latitude.toFixed(6)}, ${longitude.toFixed(6)}`;
      currentMarker.setLatLng([latitude, longitude]).bindPopup('現在地').openPopup();
      map.setView([latitude, longitude], 14);
    }, () => window.alert('現在地を取得できませんでした。住所を入力して検索してください。'));
  });
</script>
{% endblock %}
